_schema-version: 3.3.0
ID: itam-application
version: 1.0.0
description: "IT Asset Lifecycle Manager - SAP CAP Node.js + Fiori"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --no-audit --no-fund
        - npx cds build --production
        - npm run build:apps # copy Fiori apps + launchpad next to the CAP server
modules:
  - name: itam-application-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 512M # fits the BTP free tier / trial quota
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: itam-application-db
      - name: itam-application-auth

  - name: itam-application-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
      buildpack: nodejs_buildpack
    requires:
      - name: itam-application-db
  - name: itam-application
    type: approuter.nodejs
    path: .deploy/app-router
    build-parameters:
      ignore: ["node_modules/", "default-env.json"]
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: itam-application-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: itam-application-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared # free tier: needs a SAP HANA Cloud instance (plan hana-free)
  - name: itam-application-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: itam-application-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'ITAM_Admin (${org}-${space})'
            role-template-references:
              - '$XSAPPNAME.Admin'
          - name: 'ITAM_Manager (${org}-${space})'
            role-template-references:
              - '$XSAPPNAME.Manager'
          - name: 'ITAM_User (${org}-${space})'
            role-template-references:
              - '$XSAPPNAME.User'
    requires:
      - name: app-api
