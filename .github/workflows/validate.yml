name: CAP validation
on:
  push:
    branches: [feature/departments-er-alignment, feature/frd-v1.3-compliance]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check hybrid login configuration
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const p=JSON.parse(fs.readFileSync('package.json','utf8')); const a=p.cds.requires['[hybrid]'].auth; assert.equal(a.kind,'mocked'); for(const [user,role] of [['admin@itam-demo.com','Admin'],['manager@itam-demo.com','Manager'],['ravi.kumar@itam-demo.com','User']]) {assert.ok(a.users[user]); assert.ok(a.users[user].roles.includes(role));}"
      - name: Compile CDS service model
        run: npx cds compile srv/itam-service.cds
      - name: Compile Fiori annotations
        run: npx cds compile app/annotations.cds
      - name: Check all custom Fiori JavaScript, manifests and XML markup
        run: |
          find app -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --input-type=module -e "import fs from 'node:fs'; import path from 'node:path'; for(const dir of fs.readdirSync('app')) {const p=path.join('app',dir,'webapp','manifest.json'); if(fs.existsSync(p)) JSON.parse(fs.readFileSync(p,'utf8'))}"
      - name: Check report localization resource keys
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const xml=fs.readFileSync('app/reports/webapp/view/Reports.view.xml','utf8'); const bundle=fs.readFileSync('app/reports/webapp/i18n/i18n.properties','utf8'); const keys=new Set([...bundle.matchAll(/^([^#\\s=]+)=/gm)].map(m=>m[1])); const used=[...xml.matchAll(/\\{i18n>([^}]+)\\}/g)].map(m=>m[1]); const missing=used.filter(k=>!keys.has(k)); if(missing.length) {console.error('Missing report i18n keys',missing);process.exit(1)}"
      - name: Package Fiori apps
        run: npm run build:apps
      - name: Test S/4HANA connector without external credentials
        run: node --test test/s4hana.test.js
      - name: Run CAP integration tests
        run: npm test
